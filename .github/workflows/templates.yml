name: official-template-registry

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: official-template-registry-publication
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - name: Remote semantic validation
        if: github.event_name == 'push'
        env:
          AGENTS24_API_KEY: ${{ secrets.AGENTS24_TEMPLATE_VALIDATION_API_KEY }}
          AGENTS24_BASE_URL: ${{ vars.AGENTS24_TEMPLATE_PUBLISH_URL }}
        run: |
          for package in templates/*/agents24; do
            pnpm exec agents24 package validate "$package" --remote --json
          done

  publish:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run publish
        env:
          AGENTS24_TEMPLATE_PUBLISH_URL: ${{ vars.AGENTS24_TEMPLATE_PUBLISH_URL }}
          AGENTS24_TEMPLATE_PUBLISHER_TOKEN: ${{ secrets.AGENTS24_TEMPLATE_PUBLISHER_TOKEN }}
