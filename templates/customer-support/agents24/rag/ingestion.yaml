schema: agents24.rag/v1
name: Customer Support Ingestion
description: Ingests customer-support content into the managed knowledge store.
mode: ingestion
steps:
  files:
    uses: file_source
    with:
      ingestion_type: managed_file_batches
      batch_size: 1
  extract:
    uses: document_extract
  chunk:
    uses: chunker
    with:
      strategy: structure
      chunk_size: 512
      chunk_overlap: 50
  embed:
    uses: model_embedder
    with:
      model_id: $models.embedding
  store:
    uses: knowledge_store_sink
    with:
      knowledge_store_id: ../stores/knowledge.yaml
      namespace: knowledge
flow:
  - from: files
    to: extract
  - from: extract
    to: chunk
  - from: chunk
    to: embed
  - from: embed
    to: store
