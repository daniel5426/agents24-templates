schema: agents24.package/v2
package_id: pkg_11111111111111111111111111111111
name: customer-support
description: A conversational Agent backed by an optional managed Knowledge Store.
resources:
  - key: support-agent
    path: workflows/main.yaml
  - key: support-ingestion
    path: rag/ingestion.yaml
  - key: support-rag
    path: rag/knowledge.yaml
  - key: support-rag-instructions
    path: skills/rag-retrieval.md
  - key: support-store
    path: stores/knowledge.yaml
requires:
  models:
    embedding:
      required: true
      capability: embedding
      match:
        canonical_key: openai/text-embedding-3-small
    primary:
      required: true
      capability: chat
      match:
        canonical_key: openai/gpt-5.6-luna
